# Mosquitto del proyecto dentro de Docker (Linux). Misma politica que mqtt/agrovigia.conf:
# sin anonimos, ACL por usuario, sin retain, QoS maximo 1 y payload maximo 8192 bytes (v3 con diez variables).
# El puerto se publica en el host solo en 127.0.0.1 salvo que se pida LAN expresamente.
listener 18883 0.0.0.0
allow_anonymous false
password_file /mosquitto/privado/passwd
acl_file /mosquitto/config/agrovigia.acl

persistence false
retain_available false
max_qos 1
message_size_limit 8192

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
