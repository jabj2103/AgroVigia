# Ejecutar desde la raiz del repositorio mediante agrovigia.ps1.
# Primera prueba solo en este computador. No accesible desde el ESP32 aun.
listener 18883 127.0.0.1
allow_anonymous false
password_file .local/mqtt/passwd
acl_file mqtt/agrovigia.acl

persistence false
retain_available false
max_qos 1
message_size_limit 2048

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
